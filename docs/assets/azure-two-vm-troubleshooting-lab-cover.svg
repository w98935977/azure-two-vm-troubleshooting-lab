<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Azure Two-VM Troubleshooting Lab</title>
  <desc id="desc">VM01 client reaches a VM02 HTTP service through Azure NSG, UFW, and a TCP listener.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162f"/><stop offset="1" stop-color="#0c3568"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="260" fill="#0078d4" opacity=".13"/>
  <text x="800" y="105" fill="#fff" font-family="Arial, sans-serif" font-size="62" font-weight="700" text-anchor="middle">Azure Two-VM Troubleshooting Lab</text>
  <text x="800" y="158" fill="#8fd3ff" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">跨層故障排除實驗 · Microsoft Azure / Ubuntu Linux</text>

  <g filter="url(#shadow)">
    <rect x="95" y="250" width="400" height="300" rx="28" fill="#fff"/>
    <rect x="1105" y="250" width="400" height="300" rx="28" fill="#fff"/>
    <rect x="570" y="285" width="460" height="230" rx="28" fill="#eaf6ff" stroke="#36a9e1" stroke-width="4"/>
  </g>

  <rect x="145" y="300" width="95" height="78" rx="10" fill="#0078d4"/>
  <rect x="178" y="378" width="29" height="22" fill="#174a7e"/>
  <rect x="151" y="400" width="84" height="12" rx="6" fill="#174a7e"/>
  <text x="295" y="465" fill="#09264b" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">VM01 Client</text>
  <text x="295" y="510" fill="#35627f" font-family="monospace" font-size="28" text-anchor="middle">10.10.1.4</text>

  <rect x="1155" y="300" width="95" height="78" rx="10" fill="#00a4ef"/>
  <rect x="1188" y="378" width="29" height="22" fill="#174a7e"/>
  <rect x="1161" y="400" width="84" height="12" rx="6" fill="#174a7e"/>
  <text x="1305" y="465" fill="#09264b" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">VM02 HTTP</text>
  <text x="1305" y="510" fill="#35627f" font-family="monospace" font-size="28" text-anchor="middle">10.10.2.4:8080</text>

  <text x="800" y="345" fill="#09264b" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Private TCP/8080</text>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <rect x="615" y="385" width="105" height="60" rx="30" fill="#0078d4"/><text x="667" y="423" fill="#fff">NSG</text>
    <rect x="748" y="385" width="105" height="60" rx="30" fill="#00a88f"/><text x="800" y="423" fill="#fff">UFW</text>
    <rect x="881" y="385" width="105" height="60" rx="30" fill="#7a5af8"/><text x="933" y="423" fill="#fff">APP</text>
  </g>
  <path d="M495 400 H570 M1030 400 H1105" stroke="#62c6ff" stroke-width="10" stroke-linecap="round"/>
  <path d="M1090 383 L1115 400 L1090 417" fill="none" stroke="#62c6ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="800" y="650" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">Diagnose by symptom</text>
  <g font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <rect x="100" y="700" width="310" height="92" rx="22" fill="#183c6b" stroke="#68c6ff" stroke-width="3"/><text x="255" y="757" fill="#fff">Timeout</text>
    <rect x="455" y="700" width="310" height="92" rx="22" fill="#183c6b" stroke="#68c6ff" stroke-width="3"/><text x="610" y="757" fill="#fff">Connection Refused</text>
    <rect x="810" y="700" width="310" height="92" rx="22" fill="#183c6b" stroke="#68c6ff" stroke-width="3"/><text x="965" y="757" fill="#fff">HTTP 404</text>
    <rect x="1165" y="700" width="310" height="92" rx="22" fill="#183c6b" stroke="#68c6ff" stroke-width="3"/><text x="1320" y="757" fill="#fff">HTTP 500</text>
  </g>
</svg>
